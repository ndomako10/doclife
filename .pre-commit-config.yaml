# Local gate. CI runs the same checks (.github/workflows/ci.yml).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commits subject
        description: "type(scope): description. Merge and fixup/squash commits are exempt."
        language: pygrep
        stages: [commit-msg]
        entry: '\A(Merge |(fixup|squash|amend)! |(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()\n]+\))?!?: \S)'
        args: [--multiline, --negate]

      - id: pytest
        name: pytest
        entry: ./.venv/Scripts/python.exe -m pytest -q
        language: system
        files: ^(src/|tests/|pyproject\.toml$|requirements-dev\.(in|txt)$)
        pass_filenames: false
